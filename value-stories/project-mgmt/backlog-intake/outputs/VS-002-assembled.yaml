  provider: ollama
  preferred_model: qwen2.5-coder:32b
  assembled_at: '2026-01-02T22:37:29.523012'
goal:
  as_a: As a Technical Project Manager
  i_want: 'Process the ''extracted_issues'' report and automatically create the corresponding
    GitHub Issues  in the target repository using the internal GitHub MCP tool.

    '
  so_that: 'The backlog refinement process is fully automated, translating human intent
    directly into  traceable work items with zero manual data entry.

    '
instructions:
  reasoning_pattern: Chain-of-Thought
  execution_steps:
  - step_number: 1
    action: Analyze the 'extracted_issues' report. Identify each unique issue proposal
      and extract its Title, Description (Body), and Labels.
    validation_rule: All issues are parsed and ready for creation.
  - step_number: 2
    action: "For each extracted issue, ACTUALLY INVOKE the MCP tool 'create_github_issue'.\n\
      DO NOT write Python code to simulate it. DO NOT say you will do it later.\n\
      Call the tool now for each item using the following parameters:\n\nUse the Owner\
      \ and Repo from the 'target_repo_info' asset.\nArguments:\n  owner: [Owner from\
      \ target_repo_info]\n  repo: [Repo from target_repo_info]\n  title: [Extracted\
      \ Title]\n  body: [Extracted Body]\n  labels: [Extracted Labels]\n"
    validation_rule: 'The agent triggers the tool call and receives a real API response
      (e.g., ''SUCCESS: Issue created at...'').'
  - step_number: 3
    action: Generate a summary report listing the URLs of the created issues.
    validation_rule: The final output confirms success with direct links.
mcp_servers:
- name: internal-github
  command: python
  args:
  - avs-toolkit/src/avs_toolkit/github_mcp.py
  env: null
context_manifest:
- key: extracted_issues
  description: The structured list of issue proposals generated by VS-001.
  default_path: avs-standard-library/value-stories/project-mgmt/backlog-intake/outputs/vs-001-extracted-issues.md
  search_query: null
  mcp_tool_name: null
  mcp_tool_args: {}
  content: '## Issue 1: Feature: Automated Transcript Analysis and GitHub Issue Creation


    ### **Description**:

    As a project manager, I want an automated system that can analyze meeting transcripts
    and repository documentation to identify feature requests, user stories, or issues,
    then synthesize them into formal GitHub issues, so that important details discussed
    in meetings are not lost or incorrectly recorded.


    ### **Acceptance Criteria**:

    - The system should be able to parse a raw transcript file.

    - It should analyze the content of the transcript and repository documentation
    (README and ISSUE_TYPES) to identify feature requests, user stories, or bugs.

    - The identified items should be synthesized into well-defined GitHub issues with
    appropriate labels.

    - The system should push these issues directly to the specified GitHub repository.


    ### **Labels**:

    - `feature`

    - `automation`

    - `transcript-analysis`


    ---


    ## Issue 2: User Story: Automated Generation of GitHub Issues from Transcripts


    ### **as_a**: Project Manager

    ### **i_want**: An automated system that can generate GitHub issues from meeting
    transcripts and repository documentation.

    ### **so_that**: Important details discussed in meetings are accurately captured
    and not lost.


    ### **out_of_scope**:

    - Manual review or editing of the generated GitHub issues before they are pushed
    to the repository.

    - Integration with other project management tools (e.g., Jira, Trello).


    ### **in_scope**:

    - Parsing raw transcript files.

    - Analyzing content for feature requests, user stories, and bugs.

    - Synthesizing identified items into well-defined GitHub issues.

    - Pushing generated issues directly to the specified GitHub repository.


    ### **size_guestimate**: 13


    ### **Other DOR Requirements**:

    - Assignee

    - Parent: Issue 1

    - Blockers: None identified


    ### **Tasks**:

    - [ ] Develop a parser for raw transcript files.

    - [ ] Implement analysis logic to identify feature requests, user stories, and
    bugs.

    - [ ] Create templates for synthesizing GitHub issues.

    - [ ] Integrate with the GitHub API for pushing issues to the repository.

    - [ ] Write unit tests for the system components.

    - [ ] Conduct a pilot test with sample transcripts and documentation.'
